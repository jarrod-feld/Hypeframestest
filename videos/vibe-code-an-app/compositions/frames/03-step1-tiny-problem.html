        .f03-check path {

          stroke-linecap: round;
          stroke-linejoin: round;
        }
      </style>

      <div
        id="root"
        data-composition-id="03-step1-tiny-problem"
        data-width="1920"

      >

        >
          <div class="f03-deco" id="f03-deco"></div>

        <!-- content stage -->
        <div
          class="clip f03-stage"

        >
          <div class="f03-chip" id="f03-chip">Step 1</div>

          <div class="f03-headline" id="f03-headline">
            <div class="f03-word" id="f03-w1">Pick</div>

            <div class="f03-line">

          <div class="f03-lemon" id="f03-lemon">
            <svg viewBox="0 0 220 170" width="220" height="170" xmlns="http://www.w3.org/2000/svg">
              <line x1="32" y1="40" x2="32" y2="118" stroke="#000" stroke-width="8" />
              <line x1="188" y1="40" x2="188" y2="118" stroke="#000" stroke-width="8" />
              <rect x="14" y="8" width="192" height="36" fill="#f7cb46" stroke="#000" stroke-width="6" />

              <text

              <text

              <rect x="56" y="108" width="56" height="40" fill="#fffdf5" stroke="#000" stroke-width="5" />

              <rect x="350" y="108" width="56" height="40" fill="#fffdf5" stroke="#000" stroke-width="5" />

          <!-- decisive strike-through across the mall -->

          <!-- green check drawn onto the lemonade card -->
          <svg class="f03-check" viewBox="0 0 130 130" xmlns="http://www.w3.org/2000/svg">
            <path id="f03-check-back" d="M 25 70 L 55 100 L 108 34" stroke="#000" stroke-width="24" />

      <script src="assets/vendor/gsap.min.js"></script>
      <script>
        window.__timelines = window.__timelines || {};
        (function () {
          var D = 11.115;
          var tl = gsap.timeline({ paused: true });

          /* ---------- Scene 1 (0.0-2.4) — chip rail + per-word beat slam ---------- */
          tl.fromTo(
            "#f03-chip",
            { y: -170, opacity: 0 },
            { y: 0, opacity: 1, duration: 0.7, ease: "power3.out" },
            0.08
          );
          tl.fromTo(
            "#f03-deco",
            { y: -26, opacity: 0, rotation: 14 },
            { y: 0, opacity: 1, rotation: 8, duration: 0.65, ease: "power3.out" },
            0.3
          );

          /* kinetic-beat-slam: one beat spine, a DIFFERENT entrance per word */
          tl.fromTo(
            "#f03-w1",
            { scale: 1.55, opacity: 0, filter: "blur(14px)" },
            { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.5, ease: "power4.out" },
            0.95
          );
          tl.fromTo(
            "#f03-w2",
            { x: -260, opacity: 0 },
            { x: 0, opacity: 1, duration: 0.45, ease: "expo.out" },
            1.28
          );
          /* "TINY" shrinks down into place — the word does what it says */
          tl.fromTo(
            "#f03-w3",
            { scale: 2.6, opacity: 0, filter: "blur(10px)" },
            { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.5, ease: "power4.out" },
            1.6
          );
          tl.fromTo(
            "#f03-w4",
            { y: 96, rotation: 3, opacity: 0 },
            { y: 0, rotation: 0, opacity: 1, duration: 0.55, ease: "circ.out" },
            1.95
          );

          /* ---------- Scene 2 (2.4-6.1) — headline compresses up, sentence card ---------- */
          tl.to(
            "#f03-headline",
            { y: -245, scale: 0.55, duration: 0.6, ease: "power3.inOut" },
            2.55
          );
          tl.fromTo(
            "#f03-card",
            { y: 56, opacity: 0 },
            { y: 0, opacity: 1, duration: 0.65, ease: "power3.out" },
            2.9
          );

          /* discrete-text-sequence: the blank types itself in on the VO cue,
             human word-break pauses, deterministic per-frame state lookup */
          var FILL = "helps my friends split lunch orders";
          var TYPE_START = 4.15;
          var CHAR_DT = 0.042;
          var PAUSE_DT = 0.085;
          var SEQ = [{ t: 0, s: "" }];
          var acc = TYPE_START;
          var cur = "";
          for (var i = 0; i < FILL.length; i++) {
            var ch = FILL.charAt(i);
            cur += ch;
            SEQ.push({ t: acc, s: cur });
            acc += CHAR_DT + (ch === " " ? PAUSE_DT : 0);
          }
          var TYPE_END = SEQ[SEQ.length - 1].t;

          /* context-sensitive-cursor: sin-driven blink (whole cycles across D),
             solid while typing — all a pure function of driver time */
          var typedEl = document.getElementById("f03-typed");
          var caretEl = document.getElementById("f03-caret");
          var BLINK_CYCLES = 15;
          var drv = { t: 0 };
          tl.to(
            drv,
            {
              t: D,
              duration: D,
              ease: "none",
              onUpdate: function () {
                var s = "";
                for (var k = SEQ.length - 1; k >= 0; k--) {
                  if (drv.t >= SEQ[k].t) {
                    s = SEQ[k].s;
                    break;
                  }
                }
                typedEl.textContent = s;
                var typing = drv.t >= TYPE_START - 0.04 && drv.t <= TYPE_END + 0.12;
                var phase = Math.sin((drv.t / D) * Math.PI * 2 * BLINK_CYCLES);
                caretEl.style.opacity = typing ? "1" : phase > 0 ? "1" : "0";
              },
            },
            0
          );

          /* ---------- Scene 3 (6.1-9.6) — card yields upward, verdict pair lands ---------- */
          /* velocity-matched seam: the card vacates upward; both verdict entries
             continue arriving into the vacated lower half */
          tl.to("#f03-card", { y: -110, duration: 0.55, ease: "power3.inOut" }, 6.08);

          /* spring-pop-entrance (smooth register, no overshoot) on its VO cue */
          tl.fromTo(
            "#f03-lemon",
            { scale: 0, opacity: 0, y: 30, rotation: -2 },
            { scale: 1, opacity: 1, y: 0, rotation: -2, duration: 0.55, ease: "power3.out" },
            7.45
          );
          /* the oversized mall lands heavy from above on its cue */
          tl.fromTo(
            "#f03-mall",
            { y: -120, opacity: 0, scale: 1.05, rotation: 2 },
            { y: 0, opacity: 1, scale: 1, rotation: 2, duration: 0.5, ease: "power4.out" },
            8.5
          );

          /* css-marker-patterns: one decisive strike across the mall, mall dims */
          tl.fromTo(
            "#f03-strike",
            { scaleX: 0, rotation: -7, transformOrigin: "left center" },
            { scaleX: 1, rotation: -7, duration: 0.34, ease: "power2.out" },
            9.12
          );
          tl.to("#f03-mall", { opacity: 0.55, duration: 0.4, ease: "power2.out" }, 9.2);

          /* svg-path-draw: outlined green check draws onto the lemonade card */
          var back = document.getElementById("f03-check-back");
          var front = document.getElementById("f03-check-front");
          [back, front].forEach(function (p) {
            var len = p.getTotalLength() * 1.02;
            p.style.strokeDasharray = len;
            p.style.strokeDashoffset = len;
          });
          tl.to("#f03-check-back", { strokeDashoffset: 0, duration: 0.45, ease: "power2.out" }, 9.3);
          tl.to("#f03-check-front", { strokeDashoffset: 0, duration: 0.45, ease: "power2.out" }, 9.32);

          /* ---------- Scene 4 (9.6-11.1) — held read, subtle phase-opposed jitter only ---------- */
          tl.to(
            "#f03-lemon",
            { rotation: -1.6, duration: 0.6, ease: "sine.inOut", yoyo: true, repeat: 1 },
            9.85
          );
          tl.to(
            "#f03-mall",
            { rotation: 1.6, duration: 0.6, ease: "sine.inOut", yoyo: true, repeat: 1 },
            9.85
          );

          window.__timelines["03-step1-tiny-problem"] = tl;
        })();
      </script>
