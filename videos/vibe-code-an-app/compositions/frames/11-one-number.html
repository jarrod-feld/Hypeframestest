<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <!-- Frame 11 — The one number. Everything the runtime needs lives inside <template>. -->
  </head>
  <body>
    <template>
      <style>
        /* ── Fonts (only faces that ship with the project) ─────────────── */
        @font-face {
          font-family: "Inter";
          src: url("assets/fonts/Inter-800.woff2") format("woff2");
          font-weight: 800;
          font-style: normal;
        }
        @font-face {
          font-family: "Inter";
          src: url("assets/fonts/Inter-900.woff2") format("woff2");
          font-weight: 900;
          font-style: normal;
        }
        @font-face {
          font-family: "Space Grotesk";
          src: url("assets/fonts/SpaceGrotesk-600.woff2") format("woff2");
          font-weight: 600;
          font-style: normal;
        }

        /* ── Root (styled via #root only — never a class) ──────────────── */
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          container-type: size;
          font-family: "Inter", sans-serif;
        }

        /* ── Background clip (full-bleed ground lives HERE, not on #root) */
        .bg {
          position: absolute;
          inset: 0;
          background: #ffdc8b; /* cream ground — money/win act */
        }
        .glow {
          position: absolute;
          width: 48cqw;
          height: 48cqw;
          top: -2cqh;
          opacity: 0;
          pointer-events: none;
          will-change: transform, opacity;
        }
        .glow-green {
          left: 30%;
          margin-left: -24cqw;
          background: radial-gradient(
            closest-side,
            rgba(153, 232, 133, 0.85) 0%,
            rgba(153, 232, 133, 0) 70%
          );
        }
        .glow-pink {
          left: 70%;
          margin-left: -24cqw;
          background: radial-gradient(
            closest-side,
            rgba(254, 144, 232, 0.85) 0%,
            rgba(254, 144, 232, 0) 70%
          );
        }
        .dotgrid {
          position: absolute;
          top: 0;
          right: 0;
          width: 26cqw;
          height: 22cqh;
          opacity: 0.28;
          background-image: radial-gradient(circle, #000 0.065cqw, transparent 0.075cqw);
          background-size: 1.25cqw 1.25cqw;
          -webkit-mask-image: radial-gradient(closest-side at 100% 0%, #000 30%, transparent 100%);
          mask-image: radial-gradient(closest-side at 100% 0%, #000 30%, transparent 100%);
        }

        /* ── Content clip ──────────────────────────────────────────────── */
        .content {
          position: absolute;
          inset: 0;
        }

        /* Title — heading-lg, slides down into the upper third */
        .title {
          position: absolute;
          top: 7.5cqh;
          left: 0;
          right: 0;
          margin: 0;
          text-align: center;
          font-family: "Inter", sans-serif;
          font-weight: 800;
          font-size: 3.3cqw;
          line-height: 1;
          letter-spacing: -0.02em;
          text-transform: uppercase;
          color: #000;
          will-change: transform, opacity;
        }

        /* Split-tilt stage — perspective REQUIRED or rotateY flattens */
        .stage {
          position: absolute;
          left: 0;
          right: 0;
          top: 25cqh;
          height: 17.5cqw;
          display: flex;
          justify-content: center;
          align-items: flex-start;
          gap: 4.7cqw;
          perspective: 83cqw;
        }
        /* Two-layer split: wrap gets entry x/rotationY/scale, inner gets the idle jitter */
        .card-wrap {
          width: 29cqw;
          height: 17.5cqw;
          transform-style: preserve-3d;
          will-change: transform, opacity;
        }
        .card-inner {
          position: relative;
          width: 100%;
          height: 100%;
          display: flex;
          flex-direction: column;
          justify-content: center;
          align-items: center;
          gap: 1.5cqw;
          background: #ffffff;
          border: 0.4cqw solid #000;
          will-change: transform;
        }
        /* Hard offset shadows fall OUTWARD from the book-open tilt */
        .card-inner-left {
          box-shadow: -0.8cqw 0.8cqw 0 #000;
        }
        .card-inner-right {
          box-shadow: 0.8cqw 0.8cqw 0 #000;
        }
        /* Pink flush overlay — sits inside the border, under the card copy */
        .flush {
          position: absolute;
          inset: 0;
          z-index: 0;
          background: #fe90e8;
          opacity: 0;
        }
        .eyebrow {
          position: relative;
          z-index: 1;
          font-family: "Space Grotesk", sans-serif;
          font-weight: 600;
          font-size: 1.45cqw;
          letter-spacing: 0.08em;
          text-transform: uppercase;
          color: #000;
          text-align: center;
        }
        .money {
          position: relative;
          z-index: 1;
          font-family: "Inter", sans-serif;
          font-weight: 900;
          font-size: 8.5cqw;
          line-height: 1;
          letter-spacing: -0.03em;
          color: #000;
          font-variant-numeric: tabular-nums; /* mandatory — stable digit widths */
          text-align: center;
          width: 100%;
          transform-origin: 50% 50%;
          will-change: transform, opacity;
        }
        /* The one round shape — stat-deco dot pinned to each stat card */
        .deco-dot {
          position: absolute;
          z-index: 2;
          top: 1.2cqw;
          right: 1.2cqw;
          width: 1cqw;
          height: 1cqw;
          border-radius: 50%;
          border: 0.12cqw solid #000;
        }
        .deco-dot-green {
          background: #99e885;
        }
        .deco-dot-pink {
          background: #fe90e8;
        }

        /* −$2 badge — floats on the stage (NOT inside a card, so no inherited tilt) */
        .badge {
          position: absolute;
          z-index: 5;
          top: 6cqw;
          left: 50%;
          width: 13.6cqw;
          margin-left: -6.8cqw;
          height: 5.5cqw;
          display: grid;
          place-items: center;
          background: #f7cb46;
          border: 0.3cqw solid #000;
          border-radius: 9999px;
          box-shadow: 0.4cqw 0.4cqw 0 #000;
          font-family: "Inter", sans-serif;
          font-weight: 900;
          font-size: 2.9cqw;
          letter-spacing: -0.02em;
          color: #000;
          transform-origin: 50% 50%;
          will-change: transform, opacity;
        }

        /* Fix pills — label-pill chrome, tilted ±2° (rotation held in the tween) */
        .fix-row {
          position: absolute;
          left: 0;
          right: 0;
          top: 60cqh;
          display: flex;
          justify-content: center;
          gap: 9cqw;
        }
        .fix-pill {
          min-width: 22cqw;
          text-align: center;
          padding: 0.75cqw 1.8cqw;
          background: #ffffff;
          border: 0.3cqw solid #000;
          border-radius: 9999px;
          box-shadow: 0.4cqw 0.4cqw 0 #000;
          font-family: "Space Grotesk", sans-serif;
          font-weight: 600;
          font-size: 1.45cqw;
          letter-spacing: 0.08em;
          text-transform: uppercase;
          color: #000;
          will-change: transform, opacity;
        }

        /* Chant — two beats above the caption band */
        .chant-row {
          position: absolute;
          left: 0;
          right: 0;
          top: 73cqh;
          display: flex;
          justify-content: center;
          gap: 2cqw;
        }
        .chant {
          padding: 0.95cqw 2.4cqw;
          border: 0.3cqw solid #000;
          border-radius: 9999px;
          box-shadow: 0.4cqw 0.4cqw 0 #000;
          font-family: "Inter", sans-serif;
          font-weight: 800;
          font-size: 2.1cqw;
          line-height: 1.1;
          letter-spacing: -0.01em;
          text-transform: uppercase;
          will-change: transform, opacity, filter;
        }
        .chant-feed {
          background: #99e885;
          color: #000;
        }
        .chant-cut {
          background: #000;
          color: #ffffff;
        }
      </style>

      <div id="root" data-composition-id="11-one-number" data-start="0" data-duration="11.712" data-width="1920" data-height="1080">
        <!-- Track 0 — full-bleed ground + dual ambient glows + dot-grid chrome -->
        <div class="clip bg" data-start="0" data-duration="11.712" data-track-index="0">
          <div class="glow glow-green" id="n11-glow-a"></div>
          <div class="glow glow-pink" id="n11-glow-b"></div>
          <div class="dotgrid"></div>
        </div>

        <!-- Track 1 — the shot -->
        <div class="clip content" data-start="0" data-duration="11.712" data-track-index="1">
          <h1 class="title" id="n11-title">Watch one number</h1>

          <div class="stage">
            <div class="card-wrap" id="n11-card-left">
              <div class="card-inner card-inner-left" id="n11-inner-left">
                <span class="deco-dot deco-dot-green"></span>
                <div class="eyebrow">A customer pays you</div>
                <div class="money" id="n11-money-left">$0</div>
              </div>
            </div>
            <div class="card-wrap" id="n11-card-right">
              <div class="card-inner card-inner-right" id="n11-inner-right">
                <div class="flush" id="n11-flush"></div>
                <span class="deco-dot deco-dot-pink"></span>
                <div class="eyebrow">The ad cost</div>
                <div class="money" id="n11-money-right">$0</div>
              </div>
            </div>
            <div class="badge" id="n11-badge">&minus;$2</div>
          </div>

          <div class="fix-row">
            <div class="fix-pill" id="n11-fix-b">Make the app better</div>
            <div class="fix-pill" id="n11-fix-a">Make the ad cheaper</div>
          </div>

          <div class="chant-row">
            <div class="chant chant-feed" id="n11-chant-a">Feed the winners.</div>
            <div class="chant chant-cut" id="n11-chant-b">Cut the losers.</div>
          </div>
        </div>
      </div>

      <script src="assets/vendor/gsap.min.js"></script>
      <script>
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        /* ── Scene 1 (0.0–1.5s) — ambient glows bloom (bloom-and-hold form),
               title slides down from just above (translate + opacity, power3
               long-tail) forming the T-shape against the incoming cards. ── */
        tl.fromTo(
          "#n11-glow-a",
          { opacity: 0, scale: 0.88 },
          { opacity: 0.32, scale: 1, duration: 1.2, ease: "power2.out" },
          0
        );
        tl.fromTo(
          "#n11-glow-b",
          { opacity: 0, scale: 0.88 },
          { opacity: 0.3, scale: 1, duration: 1.2, ease: "power2.out" },
          0.12
        );
        tl.fromTo(
          "#n11-title",
          { y: -110, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.9, ease: "power3.out" },
          0.05
        );

        /* ── Scene 2 (1.5–5.0s) — the split-tilt entry (signature move).
               Left card from the left wing, right card ~0.2s behind from the
               right; mirrored book-open rotateY settling 19° → 12°, scale
               0.85 → 1, smooth power3 — no bounce. ── */
        tl.fromTo(
          "#n11-card-left",
          { x: -420, rotationY: 19, scale: 0.85, opacity: 0 },
          { x: 0, rotationY: 12, scale: 1, opacity: 1, duration: 0.85, ease: "power3.out" },
          1.5
        );
        tl.fromTo(
          "#n11-card-right",
          { x: 420, rotationY: -19, scale: 0.85, opacity: 0 },
          { x: 0, rotationY: -12, scale: 1, opacity: 1, duration: 0.85, ease: "power3.out" },
          1.7
        );

        /* Count-ups on their spoken cues (counting-dynamic-scale: value +
           transform scale share one ease; text set in O(1) onUpdate). */
        const moneyL = document.getElementById("n11-money-left");
        const moneyR = document.getElementById("n11-money-right");
        const stL = { v: 0 };
        const stR = { v: 0 };
        tl.to(
          stL,
          {
            v: 3,
            duration: 0.9,
            ease: "power3.out",
            onUpdate: () => {
              moneyL.textContent = "$" + Math.round(stL.v);
            },
          },
          2.6
        );
        tl.fromTo(
          moneyL,
          { scale: 0.55, opacity: 0 },
          { scale: 1, opacity: 1, duration: 0.9, ease: "power3.out" },
          2.6
        );
        tl.to(
          stR,
          {
            v: 5,
            duration: 1.0,
            ease: "power3.out",
            onUpdate: () => {
              moneyR.textContent = "$" + Math.round(stR.v);
            },
          },
          4.05
        );
        tl.fromTo(
          moneyR,
          { scale: 0.55, opacity: 0 },
          { scale: 1, opacity: 1, duration: 1.0, ease: "power3.out" },
          4.05
        );

        /* ── Scene 3 (5.0–7.7s) — "you're losing money": the $5 card's ground
               flushes pink, the $3 card dims slightly; the −$2 pill badge
               spring-pops at the inner seam (the frame's ONE earned overshoot). */
        tl.fromTo(
          "#n11-flush",
          { opacity: 0 },
          { opacity: 1, duration: 0.45, ease: "power2.out" },
          5.15
        );
        tl.to("#n11-card-left", { opacity: 0.78, duration: 0.45, ease: "power2.out" }, 5.15);
        tl.fromTo(
          "#n11-badge",
          { scale: 0, opacity: 0, rotation: -10 },
          { scale: 1, opacity: 1, rotation: -3, duration: 0.55, ease: "back.out(1.6)" },
          5.7
        );

        /* ── Scene 4 (7.7–10.7s) — sequenced fix-pill reveals on their cues
               (dynamic-content-sequencing: config array → sequential reveals),
               then the chant stamps in two beats (kinetic-beat-slam: distinct
               entrances — slam+blur, then side-snap; percussive, no bounce). */
        const FIX = [
          { sel: "#n11-fix-a", at: 7.8, rot: -2 },
          { sel: "#n11-fix-b", at: 8.45, rot: 2 },
        ];
        FIX.forEach((f) => {
          tl.fromTo(
            f.sel,
            { opacity: 0, y: 26, rotation: f.rot },
            { opacity: 1, y: 0, rotation: f.rot, duration: 0.5, ease: "power3.out" },
            f.at
          );
        });

        tl.fromTo(
          "#n11-chant-a",
          { scale: 1.45, opacity: 0, filter: "blur(14px)" },
          { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.5, ease: "power4.out" },
          9.1
        );
        tl.fromTo(
          "#n11-chant-b",
          { x: 230, opacity: 0 },
          { x: 0, opacity: 1, duration: 0.45, ease: "expo.out" },
          10.05
        );

        /* ── Scene 5 (10.7–11.7s) — hold with phase-opposed subtle jitter on
               the pair only (sine-wave-loop, low amplitude; left sin(t), right
               sin(t+π)); bounded phase tween, ends at sin(2π)=0 — settled. ── */
        const innerL = document.getElementById("n11-inner-left");
        const innerR = document.getElementById("n11-inner-right");
        const ph = { p: 0 };
        tl.to(
          ph,
          {
            p: Math.PI * 2,
            duration: 1.0,
            ease: "none",
            onUpdate: () => {
              gsap.set(innerL, { y: Math.sin(ph.p) * 2.5 });
              gsap.set(innerR, { y: Math.sin(ph.p + Math.PI) * 2.5 });
            },
          },
          10.7
        );

        window.__timelines["11-one-number"] = tl;
      </script>
    </template>
  </body>
</html>
