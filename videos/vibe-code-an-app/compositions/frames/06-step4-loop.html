<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <!-- Frame 6 — Step 4: the loop. All render-critical markup/styles/scripts live INSIDE <template>. -->
  </head>
  <body>
    <template>
      <style>
        @font-face {
          font-family: "Inter";
          src: url("assets/fonts/Inter-800.woff2") format("woff2");
          font-weight: 800;
          font-style: normal;
          font-display: block;
        }
        @font-face {
          font-family: "Inter";
          src: url("assets/fonts/Inter-900.woff2") format("woff2");
          font-weight: 900;
          font-style: normal;
          font-display: block;
        }
        @font-face {
          font-family: "Space Grotesk";
          src: url("assets/fonts/SpaceGrotesk-700.woff2") format("woff2");
          font-weight: 700;
          font-style: normal;
          font-display: block;
        }

        #root {
          position: absolute;
          inset: 0;
          width: 1920px;
          height: 1080px;
          overflow: hidden;
          font-family: "Inter", sans-serif;
        }

        /* ---------- background (full-bleed on a clip, never on #root) ---------- */
        .bg {
          position: absolute;
          inset: 0;
          background: #fe90e8;
        }
        .bg-dots {
          position: absolute;
          inset: 0;
          background-image: radial-gradient(rgba(255, 253, 245, 0.55) 1.6px, transparent 1.6px);
          background-size: 26px 26px;
          opacity: 0.32;
        }

        /* ---------- stage ---------- */
        .stage {
          position: absolute;
          inset: 0;
        }

        /* STEP rail chip — shared identity: yellow label-pill, top-left */
        .step-chip {
          position: absolute;
          top: 56px;
          left: 60px;
          display: inline-flex;
          align-items: center;
          gap: 10px;
          background: #f7cb46;
          border: 3px solid #000;
          border-radius: 9999px;
          box-shadow: 4px 4px 0 #000;
          padding: 12px 26px;
          font-family: "Space Grotesk", sans-serif;
          font-weight: 700;
          font-size: 26px;
          letter-spacing: 0.1em;
          text-transform: uppercase;
          color: #000;
        }

        .loop-title {
          position: absolute;
          top: 54px;
          left: 0;
          right: 0;
          text-align: center;
          font-weight: 900;
          font-size: 92px;
          line-height: 0.95;
          letter-spacing: -0.03em;
          text-transform: uppercase;
          color: #000;
          will-change: transform, filter, opacity;
        }

        /* corner decoration — 10-point star, cream */
        .star-deco {
          position: absolute;
          top: 96px;
          right: 118px;
          width: 118px;
          height: 118px;
          background: #ffdc8b;
          clip-path: polygon(
            50% 0%, 58.3% 24.3%, 79.4% 9.6%, 71.8% 34.1%, 97.6% 34.6%,
            77% 50%, 97.6% 65.5%, 71.8% 65.9%, 79.4% 90.5%, 58.3% 75.7%,
            50% 100%, 41.7% 75.7%, 20.6% 90.5%, 28.2% 65.9%, 2.4% 65.5%,
            23% 50%, 2.4% 34.6%, 28.2% 34.1%, 20.6% 9.6%, 41.7% 24.3%
          );
        }

        /* ---------- cycle diagram ---------- */
        .ring-svg {
          position: absolute;
          inset: 0;
          width: 1920px;
          height: 1080px;
          pointer-events: none;
        }
        .ring-svg path {
          fill: none;
          stroke: #000;
          stroke-width: 10;
          stroke-linecap: round;
        }
        .ring-svg polygon {
          fill: #000;
        }

        .node {
          position: absolute;
          width: 600px;
          height: 140px;
          display: flex;
          align-items: center;
          justify-content: center;
          will-change: transform, opacity;
        }
        .node-top { left: 660px; top: 190px; }
        .node-right { left: 1000px; top: 410px; }
        .node-bottom { left: 660px; top: 630px; }
        .node-left { left: 320px; top: 410px; }

        .node-card {
          display: flex;
          align-items: center;
          gap: 16px;
          background: #ffffff;
          border: 4px solid #000;
          box-shadow: 8px 8px 0 #000;
          padding: 19px 28px;
          will-change: transform;
        }
        .node-num {
          width: 36px;
          height: 36px;
          display: flex;
          align-items: center;
          justify-content: center;
          border: 3px solid #000;
          font-family: "Space Grotesk", sans-serif;
          font-weight: 700;
          font-size: 19px;
          color: #000;
          flex: 0 0 auto;
        }
        .num-blue { background: #c0f7fe; }
        .num-green { background: #99e885; }
        .num-yellow { background: #f7cb46; }
        .num-cream { background: #ffdc8b; }
        .node-label {
          font-weight: 800;
          font-size: 31px;
          letter-spacing: -0.01em;
          text-transform: uppercase;
          color: #000;
          white-space: nowrap;
        }

        /* hub pill at the loop's center — lands on the "repeat" cue */
        .hub-pill {
          position: absolute;
          left: 0;
          right: 0;
          top: 452px;
          display: flex;
          justify-content: center;
          pointer-events: none;
        }
        .hub-pill-inner {
          display: inline-flex;
          align-items: center;
          background: #000;
          border: 3px solid #000;
          border-radius: 9999px;
          box-shadow: 4px 4px 0 #000;
          padding: 12px 30px;
          font-family: "Space Grotesk", sans-serif;
          font-weight: 700;
          font-size: 27px;
          letter-spacing: 0.1em;
          text-transform: uppercase;
          color: #fffdf5;
          will-change: transform, opacity;
        }

        /* ---------- stranger-test pill (clip-path reveal mask: static window, content slides) ---------- */
        .done-row {
          position: absolute;
          left: 0;
          right: 0;
          top: 788px;
          display: flex;
          justify-content: center;
        }
        .done-mask {
          overflow: hidden;
          padding: 4px 16px 16px 4px;
        }
        .done-pill {
          display: inline-flex;
          align-items: center;
          gap: 18px;
          background: #ffffff;
          border: 3px solid #000;
          border-radius: 9999px;
          box-shadow: 4px 4px 0 #000;
          padding: 13px 34px 13px 16px;
          will-change: transform, opacity;
        }
        .done-tag {
          display: inline-flex;
          align-items: center;
          background: #f7cb46;
          border: 3px solid #000;
          padding: 6px 16px;
          font-weight: 800;
          font-size: 27px;
          letter-spacing: -0.01em;
          text-transform: uppercase;
          color: #000;
        }
        .done-text {
          font-family: "Space Grotesk", sans-serif;
          font-weight: 700;
          font-size: 28px;
          letter-spacing: 0.08em;
          text-transform: uppercase;
          color: #000;
          white-space: nowrap;
        }
      </style>

      <div id="root" data-composition-id="06-step4-loop" data-width="1920" data-height="1080" data-duration="9.365">
        <!-- full-bleed ground -->
        <div class="clip bg" data-start="0" data-duration="9.365" data-track-index="0">
          <div class="bg-dots"></div>
        </div>

        <!-- content -->
        <div class="clip stage" data-start="0" data-duration="9.365" data-track-index="1">
          <div class="step-chip" id="loop6-chip">Step 4</div>
          <div class="loop-title" id="loop6-title">The Loop</div>
          <div class="star-deco" id="loop6-star"></div>

          <!-- clockwise arrows, drawn between compass nodes (renders under the node cards) -->
          <svg class="ring-svg" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <!-- ellipse ring segments: cx 960, cy 480, rx 340, ry 220 -->
            <path id="loop6-a1" d="M 1130 289.5 A 340 220 0 0 1 1275.2 397.6" />
            <path id="loop6-a2" d="M 1275.2 562.4 A 340 220 0 0 1 1140.2 666.6" />
            <path id="loop6-a3" d="M 779.8 666.6 A 340 220 0 0 1 644.8 562.4" />
            <path id="loop6-a4" d="M 644.8 397.6 A 340 220 0 0 1 790 289.5" />
            <polygon id="loop6-h1" points="0,-13 24,0 0,13" transform="translate(1275.2 397.6) rotate(58)" />
            <polygon id="loop6-h2" points="0,-13 24,0 0,13" transform="translate(1140.2 666.6) rotate(158)" />
            <polygon id="loop6-h3" points="0,-13 24,0 0,13" transform="translate(644.8 562.4) rotate(238)" />
            <polygon id="loop6-h4" points="0,-13 24,0 0,13" transform="translate(790 289.5) rotate(-20.5)" />
          </svg>

          <div class="node node-top" id="loop6-n1">
            <div class="node-card">
              <span class="node-num num-blue">1</span>
              <span class="node-label">Look</span>
            </div>
          </div>
          <div class="node node-right" id="loop6-n2">
            <div class="node-card">
              <span class="node-num num-green">2</span>
              <span class="node-label">Click around</span>
            </div>
          </div>
          <div class="node node-bottom" id="loop6-n3">
            <div class="node-card">
              <span class="node-num num-yellow">3</span>
              <span class="node-label">Say what&rsquo;s wrong</span>
            </div>
          </div>
          <div class="node node-left" id="loop6-n4">
            <div class="node-card">
              <span class="node-num num-cream">4</span>
              <span class="node-label">It fixes it</span>
            </div>
          </div>

          <div class="hub-pill">
            <div class="hub-pill-inner" id="loop6-hub">Repeat</div>
          </div>

          <div class="done-row">
            <div class="done-mask">
              <div class="done-pill" id="loop6-done">
                <span class="done-tag">Done</span>
                <span class="done-text">= a stranger can use it</span>
              </div>
            </div>
          </div>
        </div>
      </div>

      <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
      <script>
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        /* ------- cue spine (seconds, from the storyboard Scene windows) ------- */
        const CUES = {
          chip: 0.1,
          title: 0.3, // "Step four: the loop." — kinetic-beat-slam, single beat
          star: 0.62,
          nodes: [1.62, 2.68, 3.72, 4.78], // "Look" · "Click around" · "Say what's wrong" · "It fixes it"
          arrows: [2.28, 3.32, 4.36, 5.68], // each draws after its node lands; 4th closes the ring on "repeat"
          hub: 5.78,
          lapStart: 6.3, // one finite highlight lap
          lapDur: 1.45,
          pill: 7.9, // stranger test
        };

        /* ------- svg path draw setup: dasharray = measured length ------- */
        const paths = [
          document.getElementById("loop6-a1"),
          document.getElementById("loop6-a2"),
          document.getElementById("loop6-a3"),
          document.getElementById("loop6-a4"),
        ];
        paths.forEach((p) => {
          const len = p.getTotalLength();
          p.style.strokeDasharray = `${len}`;
          p.style.strokeDashoffset = `${len}`;
        });
        const heads = [
          document.getElementById("loop6-h1"),
          document.getElementById("loop6-h2"),
          document.getElementById("loop6-h3"),
          document.getElementById("loop6-h4"),
        ];

        /* ------- Scene 1 (0.0–1.5): chip + title stamp ------- */
        tl.fromTo(
          "#loop6-chip",
          { y: -36, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.55, ease: "power3.out" },
          CUES.chip,
        );
        tl.fromTo(
          "#loop6-title",
          { scale: 1.45, filter: "blur(14px)", opacity: 0 },
          { scale: 1, filter: "blur(0px)", opacity: 1, duration: 0.55, ease: "power4.out" },
          CUES.title,
        );
        tl.fromTo(
          "#loop6-star",
          { rotation: -6, opacity: 0 },
          { rotation: 8, opacity: 1, duration: 0.7, ease: "power3.out" },
          CUES.star,
        );

        /* ------- Scene 2 (1.5–5.6): nodes on cues, arrows self-draw clockwise ------- */
        const nodeWraps = ["#loop6-n1", "#loop6-n2", "#loop6-n3", "#loop6-n4"];
        // short-path into-slot: each node settles outward from the loop's center
        const nodeFrom = [
          { x: 0, y: 46 },
          { x: -46, y: 0 },
          { x: 0, y: -46 },
          { x: 46, y: 0 },
        ];
        // BlockFrame tilt signature: alternate -2/+2 on the cards (GSAP-managed, no CSS transform)
        const cards = gsap.utils.toArray(".node-card");
        const tilts = [-2, 2, -2, 2];
        cards.forEach((c, i) => gsap.set(c, { rotation: tilts[i] }));

        nodeWraps.forEach((sel, i) => {
          tl.fromTo(
            sel,
            { x: nodeFrom[i].x, y: nodeFrom[i].y, scale: 0.92, opacity: 0 },
            { x: 0, y: 0, scale: 1, opacity: 1, duration: 0.6, ease: "power3.out" },
            CUES.nodes[i],
          );
        });

        paths.forEach((p, i) => {
          const dur = i === 3 ? 0.5 : 0.45;
          tl.to(p, { strokeDashoffset: 0, duration: dur, ease: "power2.out" }, CUES.arrows[i]);
          tl.fromTo(
            heads[i],
            { opacity: 0 },
            { opacity: 1, duration: 0.2, ease: "power1.out" },
            CUES.arrows[i] + dur - 0.08,
          );
        });

        /* ------- Scene 3 (5.6–7.8): ring closes, REPEAT hub, one highlight lap ------- */
        tl.fromTo(
          "#loop6-hub",
          { scale: 0.92, rotation: -3, opacity: 0 },
          { scale: 1, rotation: -3, opacity: 1, duration: 0.45, ease: "power3.out" },
          CUES.hub,
        );

        // asr-keyword-glow envelope adapted to BlockFrame (no blur glow — a yellow flush + scale),
        // traveling one clockwise lap: node → arrow → node → … Finite, single pass, no repeat.
        const segs = [];
        for (let i = 0; i < 4; i++) {
          segs.push({ type: "node", el: cards[i] });
          segs.push({ type: "arrow", path: paths[i], head: heads[i] });
        }
        const SEG_STEP = 0.112; // lap-normalized spacing between segment onsets
        const SEG_SUS = 0.075; // sustain window
        const ATTACK = 0.03;
        const RELEASE = 0.06; // last release ends at 0.919 < 1 — lap fully resolves by lap end
        function envAt(t, start) {
          if (t < start) return 0;
          if (t < start + SEG_SUS) return Math.min((t - start) / ATTACK, 1);
          const d = (t - (start + SEG_SUS)) / RELEASE;
          return d < 1 ? 1 - d : 0;
        }
        const YEL = { r: 247, g: 203, b: 70 };
        const WHITE = { r: 255, g: 255, b: 255 };
        const BLACK = { r: 0, g: 0, b: 0 };
        function lerpRgb(a, b, t) {
          const r = Math.round(a.r + (b.r - a.r) * t);
          const g = Math.round(a.g + (b.g - a.g) * t);
          const bl = Math.round(a.b + (b.b - a.b) * t);
          return `rgb(${r}, ${g}, ${bl})`;
        }
        const pulse = { t: 0 };
        tl.to(
          pulse,
          {
            t: 1,
            duration: CUES.lapDur,
            ease: "none",
            onUpdate: () => {
              segs.forEach((seg, i) => {
                const env = envAt(pulse.t, i * SEG_STEP);
                if (seg.type === "node") {
                  gsap.set(seg.el, {
                    scale: 1 + 0.05 * env,
                    backgroundColor: lerpRgb(WHITE, YEL, env),
                  });
                } else {
                  seg.path.style.stroke = lerpRgb(BLACK, YEL, env);
                  seg.path.style.strokeWidth = 10 + 4 * env;
                  seg.head.style.fill = lerpRgb(BLACK, YEL, env);
                }
              });
            },
          },
          CUES.lapStart,
        );

        /* ------- Scene 4 (7.8–9.4): stranger-test pill mask-wipes in; hold (no exit) ------- */
        tl.fromTo(
          "#loop6-done",
          { xPercent: -112, opacity: 0.4 },
          { xPercent: 0, opacity: 1, duration: 0.65, ease: "power3.out" },
          CUES.pill,
        );

        window.__timelines["06-step4-loop"] = tl;
      </script>
    </template>
  </body>
</html>
